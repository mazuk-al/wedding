<style>
  :root {
    --bg: #F6EBD9;
    --bg-glow: #FBF3E4;
    --bg-deep: #EEDDC4;
    --gold: #A0793E;      /* names, tagline, date */
    --bronze: #A9865B;    /* matches divider SVG strokes */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    color: var(--gold);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(130% 95% at 50% 30%, var(--bg-glow) 0%, var(--bg) 55%, var(--bg-deep) 100%);
  }

  /* ===== Content column ===== */
  .content {
    position: relative;
    z-index: 2;
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: min(92vw, 720px);
    padding-top: clamp(44px, 8vh, 110px);
    padding-bottom: clamp(20px, 3vh, 44px);
  }

  /* Logo widths per breakpoint spec:
     ≥1200px → 240–280, 768–1199 → 180–220, 375–767 → 140–160, ≤320 → never below 120 */
  .monogram {
    width: clamp(120px, 16vw + 80px, 280px);
    height: auto;
    filter: drop-shadow(0 12px 26px rgba(96, 62, 22, 0.20));
  }

  .names {
    margin-top: clamp(28px, 5.5vh, 76px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 18px);
    font-weight: 500;
  }
  .name {
    font-size: clamp(36px, 3.2vw + 24px, 60px);
    line-height: 1.08;
    letter-spacing: 0.05em;
    color: var(--gold);
  }

  .divider { display: block; height: auto; }
  .divider-names { width: clamp(200px, 30vw, 330px); }
  .divider-mid {
    width: clamp(120px, 15vw, 175px);
    margin-top: clamp(24px, 4.5vh, 56px);
  }

  .tagline {
    margin-top: clamp(26px, 4.5vh, 60px);
    font-size: clamp(12px, 1vw + 8px, 17px);
    font-weight: 600;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
  }

  .cta-btn {
    margin-top: clamp(28px, 5vh, 64px);
    display: inline-block;
    padding: 13px 30px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    color: var(--gold);
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(12px, 0.9vw + 8px, 15px);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    background: transparent;
    transition: background .25s ease, color .25s ease;
  }
  .cta-btn:hover,
  .cta-btn:focus-visible {
    background: var(--gold);
    color: var(--bg-glow);
  }
  .cta-btn:active { transform: scale(0.97); }

  /* ===== Bottom: mountains, lake and the date ===== */
  .bottom {
    position: relative;
    z-index: 1;
    flex: none;
    width: 100%;
    height: clamp(170px, 24vh, 310px);
  }
  .mountains {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: url("../assets/background-mountains-lake.png") center bottom / cover no-repeat;
    mix-blend-mode: multiply;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 45%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 45%);
  }
  .card-footer {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: max(clamp(16px, 3.5vh, 40px), env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.6vh, 18px);
  }
  .date {
    font-size: clamp(15px, 1vw + 10px, 22px);
    font-weight: 600;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
  }
  .divider-foot { width: clamp(92px, 12vw, 140px); }

  /* ===== Entrance ===== */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .monogram        { animation: rise 0.9s ease-out both; }
  .names, .tagline, .divider-mid { animation: rise 0.9s ease-out 0.25s both; }
  .cta-btn         { animation: rise 0.9s ease-out 0.4s both; }
  .card-footer     { animation: rise 0.9s ease-out 0.5s both; }

  @media (prefers-reduced-motion: reduce) {
    .monogram, .names, .tagline, .divider-mid, .cta-btn, .card-footer { animation: none; }
  }

  /* Short landscape viewports: tighten the column */
  @media (max-height: 560px) {
    .bottom { height: clamp(120px, 22vh, 180px); }
  }

  /* ===== Music toggle ===== */
  .music-toggle {
    position: fixed;
    z-index: 10;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid color-mix(in oklab, var(--gold) 40%, transparent);
    background: color-mix(in oklab, var(--bg-glow) 85%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--gold);
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .music-toggle:hover { background: color-mix(in oklab, var(--bg-glow) 100%, transparent); }
  .music-toggle:active { transform: scale(0.92); }
  .music-toggle svg { width: 18px; height: 18px; display: block; }
  .music-toggle .m-bars {
    display: none;
    align-items: flex-end;
    gap: 3px;
    width: 18px;
    height: 16px;
  }
  .music-toggle .m-bars span {
    width: 3px;
    background: currentColor;
    border-radius: 1px;
    transform-origin: bottom;
    animation: bar-bounce 0.85s ease-in-out infinite;
  }
  .music-toggle .m-bars span:nth-child(1) { height: 40%; animation-delay: -0.6s; }
  .music-toggle .m-bars span:nth-child(2) { height: 100%; animation-delay: -0.3s; }
  .music-toggle .m-bars span:nth-child(3) { height: 65%; animation-delay: 0s; }
  .music-toggle.is-playing .m-note { display: none; }
  .music-toggle.is-playing .m-bars { display: flex; }
  @keyframes bar-bounce {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .music-toggle .m-bars span { animation: none; transform: scaleY(0.7); }
  }
</style>
</head>

    function findLoopStart(buf) {
      var data = buf.getChannelData(0);
      var threshold = 0.01;
      for (var i = 0; i < data.length; i++) {
        if (Math.abs(data[i]) > threshold) return i / buf.sampleRate;
      }
      return 0;
    }

    // Inlined as base64 (instead of fetched) so the track loads even when
    // this page is opened directly as a file:// document — browsers block
    // fetch()/XHR for local files there with a CORS error, which silently
    // stopped the track from ever loading.
    function base64ToArrayBuffer(b64) {
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function ensureLoaded() {
      if (!loadPromise) {
        loadPromise = ctx.decodeAudioData(base64ToArrayBuffer(AUDIO_B64)).then(function (decoded) {
          buffer = decoded;
          loopStart = findLoopStart(decoded);
        });
      }
      return loadPromise;
    }

    function play() {
      return ensureLoaded().then(function () {
        if (!source) {
          source = ctx.createBufferSource();
          source.buffer = buffer;
          source.loop = true;
          source.loopStart = loopStart;
          source.loopEnd = buffer.duration;
          source.connect(ctx.destination);
          source.start(0, loopStart);
        }
        if (ctx.state === 'suspended') {
          return ctx.resume().catch(function () {});
        }
      }).then(function () {
        playing = ctx.state === 'running';
        syncUI();
      });
    }

    function pause() {
      if (ctx.state === 'running') ctx.suspend();
      playing = false;
      syncUI();
    }

    btn.addEventListener('click', function () {
      // Resume synchronously, right inside the click handler, so Chrome
      // reliably credits it to this gesture rather than to whatever
      // finishes decoding later (async work after the click can arrive
      // too late for the browser to still consider it gesture-triggered).
      if (ctx.state === 'suspended') ctx.resume().catch(function () {});
      if (playing) { pause(); } else { play().catch(function () {}); }
    });

    // Browsers block audio the visitor didn't ask for, so try to start right
    // away, then fall back to the visitor's very first tap/key anywhere on
    // the page (not just the button) the moment autoplay is blocked.
    play().catch(function () {});
    var unlockEvents = ['pointerdown', 'keydown', 'touchstart'];
    function unlock(e) {
      unlockEvents.forEach(function (type) {
        document.removeEventListener(type, unlock);
      });
      if (btn.contains(e.target)) return; // the button's own handler already owns this one
      if (!playing) play().catch(function () {});
    }
    unlockEvents.forEach(function (type) {
      document.addEventListener(type, unlock);
    });
  })();
</script>
</body>
</html>
